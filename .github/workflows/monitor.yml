name: Reservation source archive
on:
  schedule:
    - cron: '0 23,0-10 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reservation-source-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive publicly accessible source
        run: python monitor.py
      - name: Commit captured source and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "Archive public site source"
            git push
          fi
