name: Reservation source archive
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reservation-source-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive publicly accessible source
        run: python monitor.py
      - name: Publish priority review to Actions summary
        if: always()
        run: |
          if [ -f snapshots/presale_option_report.md ]; then
            cat snapshots/presale_option_report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "사전청약자 예약 페이지 집중 검토 보고서 생성 실패 — 실행 로그 확인 필요" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Commit captured source and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "Archive public site source"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push conflict, rebasing (attempt $attempt)"
              git fetch origin main
              git rebase origin/main
              sleep 5
            done
            echo "Failed to publish archive after retries" >&2
            exit 1
          fi
