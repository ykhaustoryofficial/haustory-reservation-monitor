name: Reservation source archive
on:
  schedule:
    - cron: '17,47 22,23,0-10 * * *'
    - cron: '17 11 * * *'
    # One-time 2026-11-06 09:50-10:10 KST opening watch (GitHub cron uses UTC).
    - cron: '50,55 0 6 11 *'
    - cron: '0,5,10 1 6 11 *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - monitor.py
      - .github/workflows/monitor.yml
permissions:
  contents: write
concurrency:
  group: reservation-source-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Archive publicly accessible source
        env:
          CRON_TRIGGER: ${{ github.event.schedule }}
        run: |
          # Extra opening-watch cron dates repeat yearly; run these only in 2026.
          case "$CRON_TRIGGER" in
            '50,55 0 6 11 *'|'0,5,10 1 6 11 *')
              if [ "$(date -u +%Y)" != '2026' ]; then
                echo 'One-time opening watch expired; skipping extra capture.'
                exit 0
              fi
              ;;
          esac
          python monitor.py
      - name: Commit captured source and manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots/
          if ! git diff --cached --quiet; then
            git commit -m "Archive public site source"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "Push conflict, rebasing (attempt $attempt)"
              git fetch origin main
              git rebase origin/main
              sleep 5
            done
            echo "Failed to publish archive after retries" >&2
            exit 1
          fi
